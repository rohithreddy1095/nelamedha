name: Photo gallery
# When photos are added to photos/, make web-sized copies and update the gallery list, then republish the site.
on:
  push:
    branches: [main]
    paths: ['photos/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: gallery
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow pillow-heif
      - run: python tools/gallery.py
      - name: Save the gallery
        run: |
          git config user.name "gallery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Update the photo gallery"
          git push
      - name: Republish the site
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
